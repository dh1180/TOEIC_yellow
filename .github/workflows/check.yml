name: Check
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  data-and-srs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate vocabulary, deck mapping and spaced repetition
        run: npm test
