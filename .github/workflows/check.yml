name: Check
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  data-and-srs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate vocabulary, deck mapping and spaced repetition
        run: npm test
      - name: Audit source attribution and structural completeness
        run: python3 scripts/audit_content.py
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Expo and React Native dependencies
        run: npm install --no-audit --no-fund
      - name: Export web bundle
        run: npx expo export --platform web
